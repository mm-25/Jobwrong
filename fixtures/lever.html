<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Designer application at Example Studio</title></head>
<body>
  <main class="posting-page">
    <h1>Product Designer</h1>
    <form class="application-form" action="/submitted" method="post">
      <label>Full name <input name="name" autocomplete="name" required></label>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Phone <input name="phone" type="tel" autocomplete="tel"></label>
      <label>LinkedIn URL <input name="urls[LinkedIn]" type="url"></label>
      <label>Resume <input name="resume" type="file" accept=".pdf,.doc,.docx" required></label>
      <label hidden>First name <input name="first-name"></label>
      <fieldset disabled>
        <legend>Internal details</legend>
        <label>Last name <input name="last-name"></label>
      </fieldset>
      <label>Website <input name="website" type="url" value="https://example.test/manual" readonly></label>
      <button type="submit">Submit application</button>
    </form>
  </main>
</body>
</html>
