<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apply for Product Designer at Example Studio</title>
</head>
<body>
  <main>
    <h1>Apply for Product Designer</h1>
    <form id="application-form">
      <label id="question_401-label" for="question_401">Will you now or in the future require visa sponsorship?</label>
      <div class="select-shell" id="sponsorship">
        <div>
          <div class="select__control">
            <div class="select__value-container">
              <div class="select__placeholder">Select...</div>
              <div class="select__input-container">
                <input id="question_401" class="select__input" type="text" role="combobox" aria-labelledby="question_401-label"
                  aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-required="true">
              </div>
            </div>
            <div class="select__indicators">
              <button class="icon-button icon-button--sm" type="button" aria-label="Toggle flyout" tabindex="-1">▾</button>
            </div>
          </div>
        </div>
        <input type="hidden" name="sponsorship">
        <input type="text" required aria-hidden="true" tabindex="-1" hidden>
      </div>
      <label id="question_402-label" for="question_402">Are you open to relocation?</label>
      <div class="select-shell" id="relocation">
        <div>
          <div class="select__control">
            <div class="select__value-container">
              <div class="select__single-value">No</div>
              <div class="select__input-container">
                <input id="question_402" class="select__input" type="text" role="combobox" aria-labelledby="question_402-label"
                  aria-autocomplete="list" aria-expanded="false" aria-haspopup="true">
              </div>
            </div>
            <div class="select__indicators">
              <button class="icon-button icon-button--sm" type="button" aria-label="Toggle flyout" tabindex="-1">▾</button>
            </div>
          </div>
        </div>
        <input type="hidden" name="relocation" value="n">
      </div>
      <div class="file-upload" role="group" aria-labelledby="upload-label-resume">
        <p id="upload-label-resume">Resume/CV<span aria-hidden="true">*</span></p>
        <div class="file-upload__wrapper">
          <label for="resume">Attach</label>
          <input id="resume" type="file" accept=".pdf,.doc,.docx,.txt,.rtf" hidden>
        </div>
      </div>
      <div class="file-upload" role="group" aria-labelledby="upload-label-cover_letter">
        <p id="upload-label-cover_letter">Cover Letter</p>
        <div class="file-upload__wrapper">
          <label for="cover_letter">Attach</label>
          <input id="cover_letter" type="file" accept=".pdf,.doc,.docx,.txt,.rtf" hidden>
        </div>
      </div>
      <button type="submit">Submit application</button>
    </form>
    <aside aria-label="Unrelated form widgets">
      <div id="related-listbox" role="listbox"><div role="option">Yes</div><div role="option">No</div></div>
    </aside>
  </main>
  <script>
    const form = document.querySelector('#application-form');
    const events = { submit: 0, submitClicks: 0, unrelatedClicks: 0, opened: [], selected: [], filesChanged: [],
      openerAttempts: [], pendingActivations: 0 };
    window.fixtureEvents = events;
    form.addEventListener('submit', event => { event.preventDefault(); events.submit++; });
    form.querySelector('button[type="submit"]').addEventListener('click', () => { events.submitClicks++; });
    document.querySelector('#related-listbox').addEventListener('click', () => { events.unrelatedClicks++; });
    for (const upload of form.querySelectorAll('input[type="file"]')) {
      upload.addEventListener('change', () => { events.filesChanged.push([upload.id, upload.files.length]); });
    }

    const identities = new Map([
      ['45201', ['gender', 'How would you describe your gender identity? (mark all that apply)',
        [['female', 'Female'], ['male', 'Male '], ['non-binary', 'Non-Binary'], ['decline', 'Prefer not to disclose']]]],
      ['45202', ['race', 'How would you describe your racial/ethnic background? (mark all that apply)',
        [['white', 'White'], ['asian', 'Asian'], ['more', 'Two or More'], ['decline', 'Prefer not to disclose']]]],
    ]);
    for (const [id, [name, question]] of identities) {
      form.querySelector('button[type="submit"]').insertAdjacentHTML('beforebegin', `
        <div class="select"><div class="select__container">
          <label id="${id}-label" for="${id}">${question}</label>
          <div class="select-shell" id="${name}-select">
            <div><div class="select__control">
              <div class="select__value-container select__value-container--is-multi">
                <div class="select__placeholder" id="react-select-${id}-placeholder">Select...</div>
                <div class="select__input-container"><input id="${id}" type="text" class="select__input" role="combobox"
                  aria-haspopup="true" aria-autocomplete="list" aria-expanded="false" aria-labelledby="${id}-label"
                  aria-describedby="react-select-${id}-placeholder ${id}-error"></div>
              </div>
              <div class="select__indicators"><button type="button" aria-label="Clear selections">×</button>
                <button type="button" aria-label="Toggle flyout" tabindex="-1">▾</button></div>
            </div></div>
            <input type="hidden" name="${name}">
          </div><div id="${id}-error" aria-live="polite"></div>
        </div></div>`);
    }

    for (const shell of document.querySelectorAll('.select-shell')) {
      const input = shell.querySelector('input[role="combobox"]');
      const state = shell.querySelector('input[type="hidden"]');
      const trigger = shell.querySelector('button[aria-label="Toggle flyout"]');
      const controlled = shell.querySelector('.select__control').parentElement;
      const multiple = identities.get(input.id);
      const selectedValues = new Set();
      let menu;
      let scheduled;
      function close() {
        clearTimeout(scheduled);
        if (multiple) menu?.parentElement?.remove();
        else menu?.remove();
        menu = undefined;
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-controls');
      }
      function selectChip(value, label) {
        if (selectedValues.has(value)) return;
        selectedValues.add(value);
        state.value = [...selectedValues].join(',');
        const values = shell.querySelector('.select__value-container');
        values.querySelector('.select__placeholder')?.remove();
        values.classList.add('select__value-container--has-value');
        input.setAttribute('aria-describedby', `${input.id}-error`);
        const chip = document.createElement('div');
        chip.className = 'select__multi-value';
        chip.innerHTML = `<div class="select__multi-value__label">${label}</div>
          <div role="button" class="select__multi-value__remove" aria-label="Remove ${label}">
            <button type="button" aria-label="Remove selection">×</button>
          </div>`;
        chip.querySelector('.select__multi-value__remove').addEventListener('click', () => {
          chip.remove();
          selectedValues.delete(value);
          state.value = [...selectedValues].join(',');
          events.selected.push([state.name, `remove:${value}`]);
          if (!selectedValues.size) {
            values.classList.remove('select__value-container--has-value');
            values.insertAdjacentHTML('afterbegin', `<div class="select__placeholder" id="react-select-${input.id}-placeholder">Select...</div>`);
            input.setAttribute('aria-describedby', `react-select-${input.id}-placeholder ${input.id}-error`);
          }
        });
        values.querySelector('.select__input-container').before(chip);
        events.selected.push([state.name, value]);
      }
      function open() {
        if (input.getAttribute('aria-expanded') === 'true') return;
        const menuId = `react-select-${input.id}-listbox`;
        input.setAttribute('aria-expanded', 'true');
        input.setAttribute('aria-controls', menuId);
        events.opened.push(menuId);
        scheduled = setTimeout(() => {
          menu = document.createElement('div');
          menu.className = 'select__menu-list';
          menu.id = menuId;
          menu.setAttribute('role', 'listbox');
          if (multiple) menu.setAttribute('aria-multiselectable', 'true');
          for (const [index, [value, label]] of (multiple?.[2] ?? [['y', 'Yes'], ['n', 'No']]).entries()) {
            const option = document.createElement('div');
            option.id = `react-select-${input.id}-option-${index}`;
            option.setAttribute('role', 'option');
            if (!multiple) option.setAttribute('aria-selected', String(state.value === value));
            option.textContent = label;
            option.addEventListener('click', () => {
              if (multiple) {
                selectChip(value, label);
                close();
                return;
              }
              const current = shell.querySelector('.select__placeholder, .select__single-value');
              const selected = document.createElement('div');
              selected.className = 'select__single-value';
              selected.textContent = label;
              current.replaceWith(selected);
              state.value = value;
              const requiredProxy = shell.querySelector('input[required]');
              if (requiredProxy) requiredProxy.value = value;
              input.value = '';
              events.selected.push([state.name, value]);
              close();
            });
            menu.append(option);
          }
          if (multiple) {
            const wrapper = document.createElement('div');
            wrapper.className = 'select__menu';
            wrapper.append(menu);
            shell.append(wrapper);
          } else shell.append(menu);
        }, 35);
      }
      input.addEventListener('keydown', event => {
        if (event.key === 'ArrowDown') events.openerAttempts.push([input.id, 'ArrowDown']);
      });
      function scheduleVisibility(shouldOpen) {
        events.pendingActivations++;
        setTimeout(() => {
          events.pendingActivations--;
          if (shouldOpen) open();
          else close();
        }, 120);
      }
      // The Greenhouse wrapper owns visibility. Its custom indicator cancels click.
      trigger.addEventListener('click', event => {
        events.openerAttempts.push([input.id, 'click']);
        event.preventDefault();
      });
      trigger.addEventListener('mousedown', () => events.openerAttempts.push([input.id, 'mousedown']));
      controlled.addEventListener('mouseup', event => {
        if (event.button !== 0 || event.buttons !== 0) return;
        events.openerAttempts.push([input.id, event.target === trigger ? 'mouseup' : 'unassociated mouseup']);
        scheduleVisibility(input.getAttribute('aria-expanded') !== 'true');
      });
      controlled.addEventListener('keyup', event => {
        if (event.code === 'Escape' || event.code === 'Tab') close();
        else if (event.code !== 'Enter') {
          events.openerAttempts.push([input.id, 'keyup']);
          scheduleVisibility(true);
        }
      });
      input.addEventListener('blur', close);
      shell.querySelector('[aria-label="Clear selections"]')?.addEventListener('click', () => {
        events.selected.push([state.name, 'clear all']);
      });
    }
  </script>
</body>
</html>
