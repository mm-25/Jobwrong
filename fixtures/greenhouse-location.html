<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Example Greenhouse application</title></head>
<body>
  <form id="application-form">
    <div class="select">
      <div class="select__container">
        <label for="candidate-location" id="candidate-location-label">Location (City)</label>
        <div class="select-shell">
          <span id="react-select-candidate-location-live-region"></span>
          <span role="log" aria-live="polite"><span id="aria-results"></span></span>
          <div><div class="select__control">
            <div class="select__value-container">
              <div class="select__placeholder" id="react-select-candidate-location-placeholder"></div>
              <div class="select__input-container" data-value="">
                <input id="candidate-location" type="text" autocomplete="off" class="select__input" role="combobox"
                  aria-autocomplete="list" aria-haspopup="true" aria-expanded="false" aria-labelledby="candidate-location-label"
                  aria-describedby="react-select-candidate-location-placeholder candidate-location-error">
              </div>
            </div>
            <div class="select__indicators"></div>
          </div></div>
        </div>
      </div>
    </div>
    <p id="candidate-location-error"></p>
    <button type="submit">Submit application</button>
  </form>
  <script>
    const mode = new URLSearchParams(location.search).get('mode');
    const exact = 'Springfield, Missouri, United States';
    const options = mode === 'no-match' ? ['Springfield, Illinois, United States', 'Springfield, Missouri, Canada']
      : mode === 'hidden-option' ? [exact] : [exact, exact];
    const form = document.querySelector('form');
    const input = document.querySelector('#candidate-location');
    const shell = document.querySelector('.select-shell');
    const valueContainer = shell.querySelector('.select__value-container');
    const indicators = shell.querySelector('.select__indicators');
    const resultCount = shell.querySelector('#aria-results');
    const placeholder = shell.querySelector('.select__placeholder');
    const events = window.locationFixtureEvents = { queries: [], keyUps: [], selected: [], clears: 0, submits: 0, submitClicks: 0 };
    let searchGeneration = 0;
    let trackedValue = '';
    let menuRequested = false;
    let resultsReady = false;
    const nativeValue = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
    Object.defineProperty(input, 'value', {
      get() { return nativeValue.get.call(this); },
      set(value) { trackedValue = String(value); nativeValue.set.call(this, value); },
    });

    function close() {
      menuRequested = false;
      shell.querySelector('.select__menu')?.remove();
      resultCount.textContent = '';
      input.setAttribute('aria-expanded', 'false');
      input.removeAttribute('aria-controls');
    }

    function render(target, labels) {
      target.replaceChildren();
      labels.forEach((label, index) => {
        const option = document.createElement('div');
        option.className = 'select__option';
        option.id = 'react-select-candidate-location-option-' + index;
        option.tabIndex = -1;
        option.setAttribute('role', 'option');
        option.setAttribute('aria-disabled', 'false');
        if (mode === 'disagree' && index === 1) option.title = 'Springfield, Illinois, United States';
        option.textContent = label;
        if (mode === 'hidden-option') option.innerHTML = 'Springfield<span style="display:none">, Missouri, United States</span>';
        option.addEventListener('click', () => {
          events.selected.push({ index, optionCount: target.children.length });
          commit(label);
        });
        target.append(option);
      });
    }

    function open() {
      if (!shell.querySelector('.select__menu')) {
        shell.insertAdjacentHTML('beforeend', `<div class="select__menu"><div class="select__menu-list" role="listbox"
          aria-multiselectable="false" id="react-select-candidate-location-listbox"></div></div>`);
      }
      input.setAttribute('aria-expanded', 'true');
      input.setAttribute('aria-controls', 'react-select-candidate-location-listbox');
      return shell.querySelector('[role="listbox"]');
    }

    function commit(label) {
      close();
      input.value = mode === 'no-receipt' ? label : '';
      input.dispatchEvent(new Event('change', { bubbles: true }));
      if (mode === 'no-receipt') return;
      placeholder.remove();
      input.setAttribute('aria-describedby', 'candidate-location-error');
      valueContainer.querySelector('.select__single-value')?.remove();
      const displayed = document.createElement('div');
      displayed.className = 'select__single-value';
      displayed.textContent = label;
      if (mode === 'hidden-receipt') displayed.innerHTML = 'Springfield<span style="display:none">, Missouri, United States</span>';
      valueContainer.prepend(displayed);
      indicators.innerHTML = '<div aria-hidden="false"><button type="button" aria-label="Clear selections" data-testid="clear-selection"></button></div>';
      indicators.querySelector('button').addEventListener('click', event => event.preventDefault());
      indicators.querySelector('div').addEventListener('mousedown', event => {
        if (event.button !== 0) return;
        event.preventDefault();
        events.clears++;
        displayed.remove();
        indicators.replaceChildren();
        input.value = '';
        input.dispatchEvent(new Event('change', { bubbles: true }));
        valueContainer.prepend(placeholder);
        input.setAttribute('aria-describedby', 'react-select-candidate-location-placeholder candidate-location-error');
        input.focus();
      });
    }

    function showResults(query, generation) {
      if (!menuRequested || !resultsReady || generation !== searchGeneration) return;
      const menu = open();
      resultCount.textContent = `${options.length} ${options.length === 1 ? 'result' : 'results'} available for search term ${query}.`;
      render(menu, options.slice(0, 1));
      setTimeout(() => {
        if (generation === searchGeneration && menu.isConnected) render(menu, options);
      }, 70);
    }

    input.addEventListener('input', event => {
      if (input.value === trackedValue) return;
      const query = trackedValue = input.value;
      events.queries.push({ value: query, trusted: event.isTrusted });
      const generation = ++searchGeneration;
      resultsReady = false;
      if (!query) {
        shell.querySelector('.select__menu')?.remove();
        resultCount.textContent = '';
        input.removeAttribute('aria-controls');
        return;
      }
      placeholder.remove();
      input.setAttribute('aria-describedby', 'candidate-location-error');
      if (document.activeElement !== input) return;
      shell.querySelector('[role="listbox"]')?.replaceChildren();
      resultCount.textContent = '';
      const publish = () => {
        if (generation !== searchGeneration) return;
        resultsReady = true;
        showResults(query, generation);
      };
      if (mode === 'pending') window.releaseFixtureLocationResults = publish;
      else setTimeout(publish, 50);
    });
    input.addEventListener('keyup', event => {
      events.keyUps.push(event.code);
      if (event.code === 'Escape' || event.code === 'Tab') close();
      else if (event.code !== 'Enter') {
        menuRequested = true;
        if (trackedValue) showResults(trackedValue, searchGeneration);
      }
    });
    form.addEventListener('submit', event => { event.preventDefault(); events.submits++; });
    form.querySelector('[type="submit"]').addEventListener('click', () => { events.submitClicks++; });
  </script>
</body>
</html>
